name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test

  postgres:
    name: Integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["13", "14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROUA_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pg

  action:
    name: GitHub Action (roua audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b packages/core packages/cli
      - name: A sloppy "read-only" role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE orders (id int, api_token text);
          CREATE ROLE sloppy LOGIN PASSWORD 'x';
          GRANT SELECT, INSERT ON orders TO sloppy;
          SQL
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          roles: sloppy
          cli-path: packages/cli/dist/bin.js
      - name: The action must fail and report ok=false
        run: |
          [ "${{ steps.audit.outcome }}" = "failure" ] || { echo "expected failure"; exit 1; }
          [ "${{ steps.audit.outputs.ok }}" = "false" ] || { echo "expected ok=false"; exit 1; }
          grep -q '"role": "sloppy"' "${{ steps.audit.outputs.report }}"
      - id: report-only
        uses: ./
        with:
          roles: sloppy
          fail-on: never
          cli-path: packages/cli/dist/bin.js
          sarif-file: roua.sarif
          junit-file: roua-junit.xml
          sample-values: "5"
      - name: SARIF and JUnit were written
        run: |
          node -e 'const s=JSON.parse(require("fs").readFileSync("roua.sarif","utf8")); if(s.version!=="2.1.0"||!s.runs[0].results.length) process.exit(1)'
          grep -q "<testsuite" roua-junit.xml
      - run: '[ "${{ steps.report-only.outputs.ok }}" = "false" ]'
