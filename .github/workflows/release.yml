name: Release

# Publishes @roua-dev/core, @roua-dev/app and @roua-dev/cli to npm.
# Trigger: publish a GitHub release whose tag is v<version> (for example v0.2.0).
#
# Uses npm Trusted Publishing (OIDC): no npm token is stored in this repository.
# Each package on npmjs.com has a trusted publisher set to
#   GitHub Actions / PromiseGithub / roua / release.yml
# npm checks the short-lived GitHub identity of this run and adds provenance automatically.
# Releases are staged: approve them on npmjs.com before they go live.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # No registry-url: it makes setup-node write an .npmrc with a placeholder
          # token, which npm then sends instead of using its GitHub identity.
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check tag matches package versions
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in core app cli; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v, tag is $tag"; exit 1; }
          done
          [ "$(node -p "require('./server.json').version")" = "$tag" ] || { echo "server.json version differs from $tag"; exit 1; }
          grep -q "default: \"$tag\"" action.yml || { echo "action.yml cli-version default differs from $tag"; exit 1; }
      # The trusted publishers allow only `npm stage publish`: each release waits on
      # npmjs.com until a maintainer approves it with 2FA.
      - name: Stage for publishing (core first, the CLI depends on it)
        run: |
          for p in core app cli; do
            (cd packages/$p && npm stage publish --access public --loglevel verbose)
          done

  sbom:
    name: Attach an SBOM to the release
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: CycloneDX SBOMs for the published packages
        run: |
          for p in core app cli; do
            npm sbom --sbom-format cyclonedx --omit dev --workspace packages/$p > roua-$p.cdx.json
          done
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" roua-core.cdx.json roua-app.cdx.json roua-cli.cdx.json --clobber
